# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
#
# Note: behind a TLS-intercepting proxy/AV (e.g. Avast), Gradle's downloads may
# fail with a PKIX error because the JBR truststore doesn't trust the proxy CA.
# Fix without editing this file: pass the trust store on the command line, e.g.
#   GRADLE_OPTS="-Djavax.net.ssl.trustStoreType=Windows-ROOT" ./gradlew ...
# or merge the proxy root into a cacerts copy (see docs/ANDROID.md §7).

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
